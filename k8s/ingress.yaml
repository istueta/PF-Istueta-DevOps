# Requiere instalar AWS Load Balancer Controller y configurar DNS/TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: pf-devops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: app.example.com # Reemplazar por un dominio propio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
